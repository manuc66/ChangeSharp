name: Release
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: release')"
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack ChangeSharp CLI
        run: dotnet pack ChangeSharp.Cli/ChangeSharp.Cli.csproj -o nupkg --nologo

      - name: Install ChangeSharp CLI
        run: dotnet tool install --global --add-source ./nupkg ChangeSharp.Cli

      - name: Skip release if no unreleased fragments
        id: check
        run: |
          COUNT=$(changesharp status --json | jq -r '.data.fragmentCount')
          NEXT=$(changesharp status --next-only)
          echo "fragment_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "fragment_count=$COUNT"
          echo "next_version=$NEXT"
          if [ "$COUNT" = "0" ]; then
            echo "No unreleased fragments. Skipping release."
          fi

      - name: Validate Release (Dry Run)
        if: steps.check.outputs.fragment_count != '0'
        run: changesharp release --dry-run

      - name: Perform Release
        if: steps.check.outputs.fragment_count != '0'
        run: changesharp release

      - name: Pack for NuGet
        if: steps.check.outputs.fragment_count != '0'
        run: |
          dotnet pack ChangeSharp.Cli/ChangeSharp.Cli.csproj -c Release -o nupkg-release --nologo
          dotnet pack ChangeSharp.Mcp/ChangeSharp.Mcp.csproj -c Release -o nupkg-release --nologo

      - name: NuGet login (OIDC → temp API key)
        if: steps.check.outputs.fragment_count != '0'
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: login
        with:
          user: manuc66

      - name: Push to NuGet.org
        if: steps.check.outputs.fragment_count != '0'
        run: dotnet nuget push nupkg-release/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Tag and push release
        if: steps.check.outputs.fragment_count != '0'
        run: |
          NEXT_VERSION="${{ steps.check.outputs.next_version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "chore: release $NEXT_VERSION"
          git push
          git tag v$NEXT_VERSION
          git push --tags
