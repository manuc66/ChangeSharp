name: Release
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      fragment_count: ${{ steps.plan.outputs.fragment_count }}
      next_version: ${{ steps.plan.outputs.next_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack ChangeSharp CLI
        run: dotnet pack ChangeSharp.Cli/ChangeSharp.Cli.csproj -o nupkg --nologo

      - name: Install ChangeSharp CLI
        run: dotnet tool install --global --add-source ./nupkg ChangeSharp.Cli

      - name: Compute release plan
        id: plan
        run: |
          STATUS=$(changesharp status --json)
          COUNT=$(echo "$STATUS" | jq -r '.data.fragmentCount')
          NEXT=$(echo "$STATUS" | jq -r '.data.nextVersion')
          echo "fragment_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"
          {
            echo "status<<CHANGESHARP_EOF"
            echo "$STATUS"
            echo "CHANGESHARP_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "fragment_count=$COUNT"
          echo "next_version=$NEXT"
          {
            echo "## Release plan"
            echo
            echo "Next version: **$NEXT**"
            echo
            echo '```markdown'
            echo "$STATUS" | jq -r '.data.aggregatedChanges // "No unreleased fragments."'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" = "0" ]; then
            echo "No unreleased fragments. Skipping release."
          fi

      - name: Validate Release (Dry Run)
        if: steps.plan.outputs.fragment_count != '0'
        run: changesharp release --dry-run

      - name: Post release plan for review
        if: steps.plan.outputs.fragment_count != '0' && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const status = JSON.parse(process.env.STATUS_JSON);
            const body = [
              `## 🚀 Release plan — ${status.nextVersion}`,
              ``,
              `**Fragments to release:** ${status.fragmentCount}`,
              ``,
              `### Changes`,
              ``,
              status.aggregatedChanges || "*none*",
              ``,
              `> Approve the \`release\` environment to publish this version.`
            ].join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            });
        env:
          STATUS_JSON: ${{ steps.plan.outputs.status }}

  release:
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && needs.prepare.outputs.fragment_count != '0'
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack ChangeSharp CLI
        run: dotnet pack ChangeSharp.Cli/ChangeSharp.Cli.csproj -o nupkg --nologo

      - name: Install ChangeSharp CLI
        run: dotnet tool install --global --add-source ./nupkg ChangeSharp.Cli

      - name: Perform Release
        run: changesharp release

      - name: Pack for NuGet
        run: |
          dotnet pack ChangeSharp.Cli/ChangeSharp.Cli.csproj -c Release -o nupkg-release --nologo
          dotnet pack ChangeSharp.Mcp/ChangeSharp.Mcp.csproj -c Release -o nupkg-release --nologo

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: login
        with:
          user: manuc66

      - name: Push to NuGet.org
        run: dotnet nuget push nupkg-release/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Tag and push release
        run: |
          NEXT_VERSION="${{ needs.prepare.outputs.next_version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "chore: release $NEXT_VERSION"
          git tag v$NEXT_VERSION
          git push --atomic origin main v$NEXT_VERSION

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PAYLOAD=$(changesharp publish --json)
          VERSION=$(echo "$PAYLOAD" | jq -r '.data.version')
          BODY=$(echo "$PAYLOAD" | jq -r '.data.body')
          gh release create "v$VERSION" --title "$VERSION" --notes "$BODY"